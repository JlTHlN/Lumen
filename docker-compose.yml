services:
  app:
    image: lumen:latest
    container_name: media-tracker
    restart: unless-stopped
    ports:
      - "3050:3000"
    environment:
      # Points at the db service name — correct inside Docker networking.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mediatracker
      APP_SECRET: change-me-in-production
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_STARTUP_TRIES: "30"
      TZ: Europe/London
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        # The app container will not start until the db healthcheck passes.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: media-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mediatracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready lives inside the postgres image — no extra packages needed.
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediatracker"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  app_data:
  postgres_data: