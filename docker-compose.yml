services:
  app:
    build: .
    image: reelmark:latest
    container_name: media-tracker
    restart: unless-stopped
    # Changed to use the absolute local binary path instead of npx
    command: sh -c "./node_modules/.bin/prisma db push && npm run start"
    ports:
      - "3050:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mediatracker
      APP_SECRET: ${APP_SECRET:-change-me-in-production}
      TZ: ${TZ:-UTC}
    volumes:
      - app_data:/app/data
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: media-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mediatracker
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  app_data:
  postgres_data: